<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VPA — Midnight Studio</title><link rel="stylesheet" href="dark.css"></head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img class="brand-icon" src="../../assets/icons/vpa.svg" alt=""><div><strong>Virtual Piano Arranger</strong><small>MIDNIGHT STUDIO</small></div></div>
    <nav class="top-actions"><button class="gold-key" data-action="open" data-t="open"></button><button class="gold-key" data-action="save" data-t="save"></button><button class="gold-key" data-action="export" data-t="export"></button><div class="languages language-pedals" role="group" aria-label="Language"><button data-lang="ru" aria-label="Русский" title="Русский"><span class="pedal-label">RU</span></button><button data-lang="en" aria-label="English" title="English"><span class="pedal-label">EN</span></button><button data-lang="de" aria-label="Deutsch" title="Deutsch"><span class="pedal-label">DE</span></button></div><div class="window-controls"><button class="window-button" data-window="minimize"><svg viewBox="0 0 16 16"><path d="M3 11h10"/></svg></button><button class="window-button" data-window="maximize"><svg class="maximize-icon" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg><svg class="restore-icon" viewBox="0 0 16 16"><path d="M5 5V2h9v9h-3"/><rect x="2" y="5" width="9" height="9"/></svg></button><button class="window-button window-close" data-window="close"><svg viewBox="0 0 16 16"><path d="m3 3 10 10M13 3 3 13"/></svg></button></div></nav>
  </header>
  <main>
    <div class="project-row"><div><span class="eyebrow" data-t="exampleLabel"></span><h1 data-t="project"></h1></div><div class="project-meta"><span class="status-dot"></span><span data-t="livePreview"></span><button class="gold-key" data-action="settings" aria-expanded="false" aria-controls="settings" data-t="settings"></button></div></div>
    <section class="letter-panel panel">
      <div class="section-bar"><div class="section-title"><h2 data-t="notation"></h2><span id="text-status" class="badge"></span></div><div class="toolbar"><label class="font-size"><span data-t="fontSize"></span><input id="font-size" type="range" min="16" max="40" value="24"><output id="font-value">24</output></label><button data-action="edit" id="edit-label"></button></div></div>
      <div class="follow-bar"><label><input id="follow" type="checkbox" checked><span data-t="follow"></span></label><label><input id="rhythm-hints" type="checkbox" checked><span data-t="rhythmHints"></span></label><span id="follow-status"></span><button class="text-button" data-action="follow-reset" data-t="followReset"></button></div>
      <div class="letter-body"><div class="notation-area"><div id="reading" tabindex="0" role="region" aria-label="Letter notation"></div><textarea id="notation" spellcheck="false" aria-label="Letter editor" hidden></textarea><div class="editor-foot"><span data-t="textHint"></span><span>110 BPM · 8 <span data-t="bars"></span></span></div></div></div>
    </section>
    <div id="splitter" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize piano"><i></i></div>
    <section class="piano panel">
      <div class="transport"><div class="transport-buttons"><button id="transport-toggle" class="accent play" data-action="play" disabled><span class="transport-symbol" aria-hidden="true"></span><span id="play-label"></span></button><button id="stop" data-t="stop"></button><button class="record" data-action="record"><span class="record-dot"></span><span data-t="record"></span></button></div><div class="timeline"><progress id="position" max="18" value="0" aria-label="Playback position"></progress><div><span id="time">00:00 / 00:18</span><span id="transport-status"></span></div></div><label class="tempo"><span data-t="speed"></span><input id="tempo" type="number" min="50" max="200" value="100"></label><label class="volume"><span data-t="volume"></span><input id="volume" type="range" min="0" max="100" value="65"></label><label class="check"><input id="sustain" type="checkbox"><span data-t="sustain"></span></label></div>
      <div id="recording-bar" hidden><span id="recording-summary" role="status"></span><div><button data-action="record-listen" id="record-listen"></button><button data-action="export" data-t="export"></button></div></div>
      <div id="piano-body"><div class="piano-heading"><div><span class="eyebrow">SALAMANDER GRAND</span><h2>Yamaha C5</h2></div><div class="piano-meta"><label class="key-label-choice"><span data-t="keyLabels"></span><select id="key-labels"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option><option value="none" data-t="noLabels"></option></select></label><span class="badge">61 <span data-t="keys"></span></span></div></div><div class="keyboard-wrap"><div class="keyboard-bed"><div class="gold-felt" aria-hidden="true"></div><div id="keys" tabindex="0" role="group" aria-label="Piano keyboard"></div></div></div></div>
      <div class="piano-collapse"><button class="text-button" data-action="piano" id="collapse-label" aria-controls="piano-body" aria-expanded="true"></button><div class="piano-bottom-meta"><span id="status" role="status"></span><button class="text-button" data-action="credits" data-t="credits"></button></div></div>
    </section>
    <footer><span data-t="demoOnly"></span><span>OFFLINE · MIDI FILES · NO VST</span></footer>
  </main>
</div>
<div id="settings-overlay" class="modal-backdrop" hidden>
        <section id="settings" class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="drawer-title"><div><span class="eyebrow">MIDNIGHT STUDIO</span><h2 id="settings-title" data-t="settings"></h2></div><button class="text-button" data-action="settings" data-t="close"></button></div>
          <div class="tabs" role="tablist"><button role="tab" data-tab="notes" data-t="notes"></button><button role="tab" data-tab="sound" data-t="sound"></button><button role="tab" data-tab="view" data-t="view"></button></div>
          <div class="tab-content" data-pane="notes">
            <label><span data-t="transpose"></span><div class="number-row"><input id="transpose" type="number" min="-12" max="12" value="0"><span data-t="semitones"></span></div></label>
            <button class="wide" data-action="best" data-t="best"></button>
            <label><span data-t="fullness"></span><input id="fullness" type="range" min="0" max="100" value="100"><div class="range-ends"><span data-t="easy"></span><output id="fullness-value">100%</output><span data-t="full"></span></div></label>
            <label><span data-t="layout"></span><select id="layout"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label>
            <div class="proposal"><strong data-t="preview"></strong><p id="proposal-metrics"></p><pre id="proposal-text"></pre><p id="proposal-message"></p><div class="proposal-actions"><button class="accent" data-action="apply" data-t="apply"></button><button data-action="cancel" data-t="cancel"></button></div></div>
          </div>
          <div class="tab-content" data-pane="sound" hidden>
            <label><span data-t="tone"></span><select id="layer"><option value="3" data-t="soft"></option><option value="8" selected data-t="normal"></option><option value="13" data-t="bright"></option></select></label>
            <label><span data-t="reverb"></span><select id="reverb-preset"><option value="off" data-t="dry"></option><option value="room" selected data-t="room"></option><option value="hall" data-t="hall"></option></select></label>
            <label><span data-t="amount"></span><input id="room" type="range" min="0" max="100" value="20"><output id="room-value">20%</output></label>
            <p class="hint" data-t="reverbHint"></p><button class="wide" data-action="compare" data-t="compare"></button>
          </div>
          <div class="tab-content" data-pane="view" hidden><div class="language-layout-settings"><label><span data-t="interfaceLanguage"></span><select id="interface-language"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label><label class="check"><input id="link-language-layout" type="checkbox" checked><span data-t="linkLanguageLayout"></span></label><label><span data-t="physicalLayout"></span><select id="physical-layout"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label><p class="hint" data-t="languageLayoutHint"></p></div><p class="hint" data-t="resizeHint"></p><label class="check"><input id="reduced-motion" type="checkbox"><span data-t="reduceMotion"></span></label><p class="hint" data-t="futureHint"></p></div>
      <div id="conflict" hidden><span data-t="conflict"></span><button data-action="keep" data-t="keep"></button><button class="accent" data-action="replace" data-t="replace"></button></div>
        </section>
</div>
<div class="resize-edges" aria-hidden="true"><i data-resize="n"></i><i data-resize="s"></i><i data-resize="w"></i><i data-resize="e"></i><i data-resize="nw"></i><i data-resize="ne"></i><i data-resize="sw"></i><i data-resize="se"></i></div>
<div id="notice" class="modal-backdrop" hidden><section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="notice-title"><h2 id="notice-title"></h2><p id="notice-text"></p><button class="gold-key" data-action="notice-close" data-t="understood"></button></section></div>
<div id="export-overlay" class="modal-backdrop" hidden><section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="export-title"><h2 id="export-title" data-t="exportTitle"></h2><p data-t="exportHint"></p><label><span data-t="audioFormat"></span><select id="audio-format"></select></label><p id="export-status" role="status"></p><div class="proposal-actions"><button class="gold-key" data-action="export-file" data-t="chooseFile"></button><button data-action="export-close" data-t="close"></button></div></section></div>
<div id="record-replace-overlay" class="modal-backdrop" hidden><section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="record-replace-title"><h2 id="record-replace-title" data-t="newRecording"></h2><p data-t="replaceRecording"></p><div class="proposal-actions"><button class="gold-key" data-action="record-replace" data-t="replace"></button><button data-action="record-keep" data-t="cancel"></button></div></section></div>
<div id="engine-controls" hidden><button id="play"></button><button id="pause"></button></div>
<div id="file-overlay" class="modal-backdrop" hidden><section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="file-title"><h2 id="file-title"></h2><div id="file-open-actions" class="file-actions"><button class="gold-key" data-document-action="open"></button><input id="pdf-page" type="hidden" value="1"><button data-document-action="recognize" hidden></button></div><div id="file-export-actions" class="file-actions" hidden><button class="gold-key" data-document-action="txt"></button><button data-document-action="audio"></button></div><p id="file-error" role="status"></p><button data-document-action="dismiss"></button></section></div>
<script src="dark.js"></script><script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="../../assets/offline_piano/piano.js"></script><script src="../../assets/offline_piano/recording.js"></script><script src="recording-ui.js"></script><script src="document-ui.js"></script>
</body></html>
